name: Lint

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

jobs:
  # Every pull request runs this workflow so the required "Lint result"
  # check always reports; the expensive job runs only when its inputs change.
  changes:
    name: Detect lint inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the event's own commits, not the PR's current files, so a rerun
          # judges the revision it reports on. tree:0 fetches commits only; git
          # pulls the two trees it compares on demand. --no-renames lists both
          # sides of a rename. Assigning first fails the step if git fails.
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --filter=tree:0 --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          relevant=false
          while IFS= read -r f; do
            case "$f" in
              whitenoise-ios/*|whitenoise-iosTests/*|Shared/*|NotificationServiceExtension/*|.swiftlint.yml|scripts/lint.sh|scripts/check-localization-catalog.py|scripts/tests/*|justfile|.github/workflows/lint.yml) relevant=true ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  # Runs unconditionally on every PR and push so master can never take a
  # pre-release MarmotKit pin, even if no Swift files changed.
  marmotkit-channel:
    name: MarmotKit release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check MarmotKit release channel
        run: scripts/ci/check-marmotkit-channel.sh

  swiftlint:
    name: SwiftLint (Airbnb config, --strict)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # The catalog check itself runs inside scripts/lint.sh below.
      - name: Test the localization catalog check
        run: python3 -m unittest discover -s scripts/tests -p 'test_localization_catalog.py'

      - name: Install SwiftLint
        env:
          # Keep in lockstep with REQUIRED_SWIFTLINT_VERSION in scripts/lint.sh.
          SWIFTLINT_VERSION: "0.65.1"
          # The release's published digest for portable_swiftlint.zip; update with the version.
          SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | shasum -a 256 -c -
          unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint >/dev/null
          sudo install /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: Run lint
        env:
          CI: true
        run: ./scripts/lint.sh

  # The ruleset requires this check. It passes only when the channel check
  # passed AND swiftlint passed (or was skipped because no input changed); a
  # failed, cancelled or missing filter fails it.
  result:
    name: Lint result
    if: always()
    needs: [changes, marmotkit-channel, swiftlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANNEL: ${{ needs.marmotkit-channel.result }}
          JOB: ${{ needs.swiftlint.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT channel=$CHANNEL swiftlint=$JOB"
          [ "$CHANGES" = success ] || exit 1
          [ "$CHANNEL" = success ] || exit 1
          [ "$JOB" = success ] || { [ "$RELEVANT" = false ] && [ "$JOB" = skipped ]; }
