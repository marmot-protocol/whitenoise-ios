name: Privacy

# Builds both Release apps and runs the built-bundle privacy check on every
# pull request and master push, in parallel with Tests. The job only calls
# scripts/check-privacy.sh, so any failure reproduces locally with that script.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Every master commit gets
# its own group: a group holds only one pending run, so a shared master group
# would let a later push cancel a waiting release-bump run before it checked.
concurrency:
  group: privacy-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  release-privacy:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      # Same cleanup as the Tests workflow: two Release builds need the disk
      # that the image's unused Xcodes and simulator runtimes occupy. Keep the
      # iOS 26 simulator runtime: without it xcodebuild reports the iOS
      # platform as not installed and rejects the generic device destination.
      - name: Free runner disk
        run: |
          df -h /
          keep="$(dirname "$(dirname "$(xcode-select -p)")")"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$(cd "$keep" && pwd -P)" ] || sudo rm -rf "$x" &
          done
          xcrun simctl runtime list -j \
            | python3 -c 'import json,sys; [print(k) for k,v in json.load(sys.stdin).items() if not v["platformIdentifier"].endswith("iphonesimulator") or not v["version"].startswith("26")]' \
            | xargs -n1 xcrun simctl runtime delete || true
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.ghcup &
          wait
          df -h /

      - name: Cache Swift package artifacts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-xcode26-${{ hashFiles('Packages/MarmotKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26-

      - name: Build both Release apps and check privacy configuration
        timeout-minutes: 35
        env:
          WN_PRIVACY_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData-privacy
          WN_PRIVACY_SOURCE_PACKAGES: ${{ github.workspace }}/build/SourcePackages
        run: ./scripts/check-privacy.sh
