name: Tests

on:
  pull_request:
    # `labeled` lets adding the full-tests label rerun the PR on the full tier.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "whitenoise-ios/**"
      - "whitenoise-iosTests/**"
      - "Shared/**"
      - "NotificationServiceExtension/**"
      - "Vendored/**"
      - "Config/**"
      - "whitenoise-ios.xcodeproj/**"
      - "Packages/**"
      - "scripts/sync-local-bindings.sh"
      - "scripts/check-analytics-release-config.py"
      - "scripts/check-marmotkit-bindings.py"
      - "scripts/tests/**"
      - "scripts/test.sh"
      - "scripts/pick-simulator.sh"
      - "scripts/audit/**"
      - "TestPlans/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [master]
  # Nightly full-tier run on master. A failure reaches people only through
  # GitHub's default workflow-failure notifications (no issue or alert).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      raw_log:
        description: "Measurement run: keep xcodebuild's raw timestamped test log and the simulator log (WN_TEST_RAW_LOG=1)"
        type: boolean
        default: false

permissions:
  contents: read

# The nightly run has its own group so it never replaces a pending master
# push run (a group keeps one pending run). A pull request label other than
# full-tests gets a group of its own, so its (skipped) run never cancels the
# branch's active run; the job's `if` below skips it.
concurrency:
  group: tests-${{ github.event_name == 'schedule' && 'nightly' || (github.event.action == 'labeled' && github.event.label.name != 'full-tests' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-tests'
    runs-on: macos-15
    # Allow runner setup and artifact upload around the bounded 40-minute test step.
    timeout-minutes: 55

    env:
      WN_TEST_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      WN_TEST_SOURCE_PACKAGES: ${{ github.workspace }}/build/SourcePackages
      WN_TEST_COMPILATION_CACHE: ${{ github.workspace }}/build/CompilationCache
      # Opt-in raw timing capture for scripts/audit; empty on every event but a
      # manual dispatch that asked for it.
      WN_TEST_RAW_LOG: ${{ inputs.raw_log && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; depth 2 keeps the base
          # parent so the tier step can diff against it.
          fetch-depth: 2

      # Owner decision to confirm: pull requests run the PR tier unless they
      # touch code whose risk lives in the runtime/hosting tiers (MarmotKit
      # packages, Shared/, the extension, whitenoise-ios/Core, onboarding and
      # account setup, test support) or carry the `full-tests` label; master
      # pushes, the nightly schedule and manual runs always run the full tier.
      - name: Choose test tier
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-tests') }}
        run: |
          tier=full
          if [ "$EVENT" = "pull_request" ]; then
            tier=pr
            if [ "$FULL_LABEL" = "true" ]; then
              tier=full
              echo "full-tests label: full tier"
            else
              # --no-renames lists both sides of a move, so moving a file out
              # of a forced path still forces the full tier.
              changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
              forced="$(printf '%s\n' "$changed" | grep -E '^(Packages/|Shared/|NotificationServiceExtension/|whitenoise-ios/Core/|whitenoise-ios/Onboarding/|whitenoise-iosTests/TestSupport/)' || true)"
              if [ -n "$forced" ]; then
                tier=full
                echo "full tier forced by:"
                printf '  %s\n' $forced
              fi
            fi
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Test tier: $tier"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      # Extracting the compiler cache ran out of disk alongside the image's
      # unused Xcodes, simulator runtimes and toolchains, so drop them first.
      - name: Free runner disk
        run: |
          df -h /
          keep="$(dirname "$(dirname "$(xcode-select -p)")")"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$(cd "$keep" && pwd -P)" ] || sudo rm -rf "$x" &
          done
          xcrun simctl runtime list -j \
            | python3 -c 'import json,sys; [print(k) for k,v in json.load(sys.stdin).items() if not v["platformIdentifier"].endswith("iphonesimulator") or not v["version"].startswith("26")]' \
            | xargs -n1 xcrun simctl runtime delete || true
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.ghcup &
          wait
          df -h /

      - name: Verify published MarmotKit provenance
        run: python3 scripts/check-marmotkit-bindings.py

      - name: Test release configuration checks
        run: python3 -m unittest discover -s scripts/tests

      # The MarmotKit binary target is a 74 MB download that unpacks to 254 MB.
      # It only changes when the pinned release does, so key it on the manifest.
      - name: Cache Swift package artifacts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-xcode26-${{ hashFiles('Packages/MarmotKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26-

      - name: Isolate simulator clipboard
        # Host clipboard sync can stall UIPasteboard reads and block MainActor tests.
        run: defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false

      # Compiler cache keys hash compiler inputs rather than file mtimes, so a
      # fresh checkout still replays cached objects. Only master writes the
      # cache; pull requests read master's copy and never evict each other.
      # To disable, drop WN_TEST_COMPILATION_CACHE from the job env above.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-xcode26-${{ github.sha }}
          restore-keys: |
            cas-${{ runner.os }}-xcode26-

      - name: Run tests
        # End the step before the job deadline so failure artifacts can upload.
        timeout-minutes: 40
        # The tier comes from the Choose test tier step above. To run the full
        # suite on every pull request, make this `--tier full`.
        run: |
          bash scripts/bench/memlog.sh build/audit/memory.csv &
          sampler=$!
          set +e
          ./scripts/test.sh --tier ${{ steps.tier.outputs.tier }}
          code=$?
          kill $sampler
          python3 scripts/bench/memsummary.py build/audit/memory.csv | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Report test phases
        if: always()
        run: ./scripts/audit/report-run.sh build/TestResults.xcresult

      - name: Save compilation cache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-xcode26-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestAudit
          path: build/audit
          if-no-files-found: ignore
          retention-days: 7
