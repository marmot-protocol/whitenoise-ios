name: Tests

on:
  pull_request:
    paths:
      - "whitenoise-ios/**"
      - "whitenoise-iosTests/**"
      - "Shared/**"
      - "NotificationServiceExtension/**"
      - "Vendored/**"
      - "Config/**"
      - "whitenoise-ios.xcodeproj/**"
      - "Packages/**"
      - "scripts/sync-local-bindings.sh"
      - "scripts/check-analytics-release-config.py"
      - "scripts/check-marmotkit-bindings.py"
      - "scripts/tests/**"
      - "scripts/test.sh"
      - "scripts/pick-simulator.sh"
      - ".github/workflows/tests.yml"
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: xcode-27
    # Allow runner setup and artifact upload around the bounded 40-minute test step.
    timeout-minutes: 55

    env:
      # D2 on #1202 keeps CI at one runtime permit; pin it so a runner with more
      # cores doesn't raise it.
      TEST_RUNNER_WN_TEST_GATE_CORES: "3"
      WN_TEST_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      WN_TEST_SOURCE_PACKAGES: ${{ github.workspace }}/build/SourcePackages
      WN_TEST_COMPILATION_CACHE: ${{ github.workspace }}/build/CompilationCache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      # Extracting the compiler cache ran out of disk alongside the image's
      # unused Xcodes, simulator runtimes and toolchains, so drop them first.
      - name: Free runner disk
        run: |
          df -h /
          keep="$(dirname "$(dirname "$(xcode-select -p)")")"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$(cd "$keep" && pwd -P)" ] || sudo rm -rf "$x" &
          done
          xcrun simctl runtime list -j \
            | python3 -c 'import json,sys; [print(k) for k,v in json.load(sys.stdin).items() if not v["platformIdentifier"].endswith("iphonesimulator") or not v["version"].startswith("27")]' \
            | xargs -n1 xcrun simctl runtime delete || true
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.ghcup &
          wait
          df -h /

      - name: Pick simulator
        # Test on an iPhone Air, on the newest iOS runtime that has one.
        run: |
          destination=$(WN_TEST_DEVICE_NAME="iPhone Air" scripts/pick-simulator.sh)
          echo "WN_TEST_DESTINATION=$destination" >> "$GITHUB_ENV"

      - name: Verify published MarmotKit provenance
        run: python3 scripts/check-marmotkit-bindings.py

      - name: Test release configuration checks
        run: python3 -m unittest discover -s scripts/tests

      # The MarmotKit binary target is a 74 MB download that unpacks to 254 MB.
      # It only changes when the pinned release does, so key it on the manifest.
      - name: Cache Swift package artifacts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('Packages/MarmotKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Isolate simulator clipboard
        # Host clipboard sync can stall UIPasteboard reads and block MainActor tests.
        run: defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false

      # Compiler cache keys hash compiler inputs rather than file mtimes, so a
      # fresh checkout still replays cached objects. Only master writes the
      # cache; pull requests read master's copy and never evict each other.
      # To disable, drop WN_TEST_COMPILATION_CACHE from the job env above.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            cas-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Run tests
        # End the step before the job deadline so failure artifacts can upload.
        timeout-minutes: 40
        run: ./scripts/test.sh

      - name: Save compilation cache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ github.sha }}

      - name: Capture wn1302 probe log
        if: always()
        run: |
          udid=$(echo "$WN_TEST_DESTINATION" | sed -E 's/.*id=([A-F0-9-]+).*/\1/')
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl spawn "$udid" log show --last 3h --style compact --predicate 'category == "wn1302"' > build/wn1302.log 2>&1 || true
          wc -l build/wn1302.log
          grep -n "test begin" build/wn1302.log | head

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            build/TestResults.xcresult
            build/wn1302.log
          if-no-files-found: warn
