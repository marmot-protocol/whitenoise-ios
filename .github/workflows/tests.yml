name: Tests

on:
  pull_request:
  push:
    # ci-stall-experiment: throwaway benchmark branch, do not merge.
    branches: [master, ci-stall-experiment]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Every pull request runs this workflow so the required "Tests result"
  # check always reports; the expensive job runs only when its inputs change.
  changes:
    name: Detect test inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff the event's own commits, not the PR's current files, so a rerun
          # judges the revision it reports on. tree:0 fetches commits only; git
          # pulls the two trees it compares on demand. --no-renames lists both
          # sides of a rename. Assigning first fails the step if git fails.
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --filter=tree:0 --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          relevant=false
          while IFS= read -r f; do
            case "$f" in
              whitenoise-ios/*|whitenoise-iosTests/*|Shared/*|NotificationServiceExtension/*|Vendored/*|Config/*|whitenoise-ios.xcodeproj/*|Packages/*|scripts/sync-local-bindings.sh|Info.plist|scripts/check-analytics-release-config.py|scripts/check-privacy-release-config.py|scripts/check-localization-catalog.py|scripts/check-marmotkit-bindings.py|scripts/tests/*|scripts/test.sh|scripts/pick-simulator.sh|.github/workflows/tests.yml) relevant=true ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Benchmark: the simulator's first boot floods the runner for several
    # minutes. Where does that load cost least: alongside the build (today),
    # after it, or alongside the setup steps at the start of the job?
    name: test (boot ${{ matrix.boot }})
    strategy:
      fail-fast: false
      matrix:
        boot: [during-build, after-build, job-start]
    runs-on: xcode-27
    # Allow runner setup and artifact upload around the bounded 50-minute test step.
    timeout-minutes: 65

    env:
      # D2 on #1202 keeps CI at one runtime permit; pin it so a runner with more
      # cores doesn't raise it.
      TEST_RUNNER_WN_TEST_GATE_CORES: "3"
      WN_TEST_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      WN_TEST_SOURCE_PACKAGES: ${{ github.workspace }}/build/SourcePackages
      WN_TEST_COMPILATION_CACHE: ${{ github.workspace }}/build/CompilationCache
      WN_TEST_BOOT_SIMULATOR: ${{ matrix.boot }}
      WN_TEST_TIMING_DIR: ${{ github.workspace }}/build/ci-timing

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27"

      # These two run before the cleanup in every arm, so the job-start arm can
      # boot the simulator this early without the arms differing otherwise.
      - name: Isolate simulator clipboard
        # Host clipboard sync can stall UIPasteboard reads and block MainActor tests.
        run: defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false

      - name: Pick simulator
        # Test on an iPhone Air, on the newest iOS runtime that has one.
        run: |
          mkdir -p build/ci-timing
          destination=$(WN_TEST_DEVICE_NAME="iPhone Air" scripts/pick-simulator.sh)
          echo "WN_TEST_DESTINATION=$destination" >> "$GITHUB_ENV"
          echo "$destination" | tee build/ci-timing/destination.txt
          xcrun simctl list devices available > build/ci-timing/devices-at-pick.txt || true

      # The boot request must be accepted here, or this job would boot after
      # the build and be a mislabelled sample. The boot then carries on after
      # the step ends; scripts/test.sh waits for it once the build is done.
      - name: Boot simulator at job start
        if: matrix.boot == 'job-start'
        run: |
          case "$WN_TEST_DESTINATION" in
            *id=*) udid="${WN_TEST_DESTINATION##*id=}"; udid="${udid%%,*}" ;;
            *) echo "WN_TEST_DESTINATION has no id=: $WN_TEST_DESTINATION" >&2; exit 1 ;;
          esac
          date -u +%FT%TZ | tee build/ci-timing/simulator-boot-requested.txt
          xcrun simctl boot "$udid"
          date -u +%FT%TZ | tee build/ci-timing/simulator-boot-accepted.txt
          # Only an observer: it records the boot's progress with timestamps.
          nohup xcrun simctl bootstatus "$udid" > build/ci-timing/simulator-boot.log 2>&1 < /dev/null &
          echo "$!" > build/ci-timing/simulator-boot.pid

      # Extracting the compiler cache ran out of disk alongside the image's
      # unused Xcodes, simulator runtimes and toolchains, so drop them first.
      - name: Free runner disk
        env:
          # Round one showed deleting the unused simulator runtimes changes
          # neither the stall nor the disk headroom, so every arm keeps them.
          # Turning it back on means picking the simulator after this step again.
          RUNTIMES: kept
        run: |
          mkdir -p build/ci-timing
          df -h / | tee build/ci-timing/disk-before-cleanup.txt
          keep="$(dirname "$(dirname "$(xcode-select -p)")")"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$(cd "$keep" && pwd -P)" ] || sudo rm -rf "$x" &
          done
          # The runtimes are still listed, and any deletion's outcome recorded,
          # so a later round can turn the deletion back on.
          xcrun simctl runtime list -j > build/ci-timing/runtimes-before.json || true
          targets=$(python3 -c 'import json,sys; [print(k) for k,v in json.load(sys.stdin).items() if not v["platformIdentifier"].endswith("iphonesimulator") or not v["version"].startswith("27")]' < build/ci-timing/runtimes-before.json || true)
          {
            echo "arm: $RUNTIMES"
            echo "runtimes outside iOS 27: $(printf '%s\n' "$targets" | grep -c . || true)"
            if [ "$RUNTIMES" = deleted ]; then
              for id in $targets; do
                if xcrun simctl runtime delete "$id"; then echo "delete requested: $id"; else echo "delete FAILED: $id"; fi
              done
            fi
          } 2>&1 | tee build/ci-timing/runtime-cleanup.txt
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.ghcup &
          wait
          xcrun simctl runtime list -j > build/ci-timing/runtimes-after.json || true
          df -h / | tee build/ci-timing/disk-after-cleanup.txt

      - name: Verify published MarmotKit provenance
        run: python3 scripts/check-marmotkit-bindings.py

      - name: Test release configuration checks
        run: python3 -m unittest discover -s scripts/tests

      # The MarmotKit binary target is a 74 MB download that unpacks to 254 MB.
      # It only changes when the pinned release does, so key it on the manifest.
      - name: Cache Swift package artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('Packages/MarmotKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-

      # Compiler cache keys hash compiler inputs rather than file mtimes, so a
      # fresh checkout still replays cached objects. Only master writes the
      # cache; pull requests read master's copy and never evict each other.
      # To disable, drop WN_TEST_COMPILATION_CACHE from the job env above.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            cas-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Run tests
        # End the step before the job deadline so failure artifacts can upload.
        # A MarmotKit update misses both caches (a new binary to download and
        # generated Swift that recompiles most of the app), which takes about
        # 30 minutes to build before ~15 minutes of tests.
        timeout-minutes: 50
        run: ./scripts/test.sh

      - name: Save compilation cache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.xcode.outputs.version }}-${{ github.sha }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestResults-${{ matrix.boot }}-attempt${{ github.run_attempt }}
          path: build/TestResults.xcresult
          if-no-files-found: warn

      # Lowest free space matters for whether the cleanup step is needed at all.
      - name: Collect timing
        if: always()
        env:
          # A newer master cache between rounds changes the compile work.
          CACHE_KEY: ${{ steps.compilation-cache.outputs.cache-matched-key }}
        run: |
          echo "${CACHE_KEY:-none}" | tee build/ci-timing/compile-cache-key.txt
          # Stop the boot observer so it isn't writing while the files upload.
          if [ -f build/ci-timing/simulator-boot.pid ]; then
            kill "$(cat build/ci-timing/simulator-boot.pid)" 2>/dev/null || true
          fi
          df -h / | tee build/ci-timing/disk-at-end.txt
          cat build/ci-timing/probe.log || true
          gzip -f build/ci-timing/*.raw.log || true

      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-timing-${{ matrix.boot }}-attempt${{ github.run_attempt }}
          path: build/ci-timing
          if-no-files-found: warn

  # The ruleset requires this check. It passes only when the job passed, or was
  # skipped because no input changed; a failed, cancelled or missing filter fails it.
  result:
    name: Tests result
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          JOB: ${{ needs.test.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT test=$JOB"
          [ "$CHANGES" = success ] || exit 1
          [ "$JOB" = success ] || { [ "$RELEVANT" = false ] && [ "$JOB" = skipped ]; }
