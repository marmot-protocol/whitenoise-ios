name: Tests

on:
  pull_request:
    paths:
      - "whitenoise-ios/**"
      - "whitenoise-iosTests/**"
      - "Shared/**"
      - "NotificationServiceExtension/**"
      - "Vendored/**"
      - "Config/**"
      - "whitenoise-ios.xcodeproj/**"
      - "Packages/**"
      - "scripts/sync-local-bindings.sh"
      - "scripts/test.sh"
      - "scripts/pick-simulator.sh"
      - ".github/workflows/tests.yml"
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: macos-15
    # The draft also compiles pinned Rust bindings for host, device, and simulator.
    timeout-minutes: 60

    env:
      WN_TEST_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      WN_TEST_SOURCE_PACKAGES: ${{ github.workspace }}/build/SourcePackages
      WN_TEST_COMPILATION_CACHE: ${{ github.workspace }}/build/CompilationCache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Read local MDK pin
        id: local-mdk
        if: hashFiles('Packages/MarmotKit/LOCAL_BUILD.json') != ''
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          with open('Packages/MarmotKit/LOCAL_BUILD.json') as source:
              sha = json.load(source)['source_sha']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\n')
          PYTHON

      - name: Check out pinned MDK for development bindings
        if: steps.local-mdk.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          repository: marmot-protocol/mdk
          ref: ${{ steps.local-mdk.outputs.sha }}
          path: build/local-mdk
          persist-credentials: false

      - name: Build matching local bindings
        if: steps.local-mdk.outputs.sha != ''
        env:
          LOCAL_MDK_SHA: ${{ steps.local-mdk.outputs.sha }}
        run: |
          cp Packages/MarmotKit/Sources/MarmotKit/MarmotKit.swift build/expected-MarmotKit.swift
          ./scripts/sync-local-bindings.sh build/local-mdk "$LOCAL_MDK_SHA"
          cmp build/expected-MarmotKit.swift Packages/MarmotKit/Sources/MarmotKit/MarmotKit.swift

      # The MarmotKit binary target is a 74 MB download that unpacks to 254 MB.
      # It only changes when the pinned release does, so key it on the manifest.
      - name: Cache Swift package artifacts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-xcode26-${{ hashFiles('Packages/MarmotKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26-

      # Compiler cache keys hash compiler inputs rather than file mtimes, so a
      # fresh checkout still replays cached objects. Only master writes the
      # cache; pull requests read master's copy and never evict each other.
      # To disable, drop WN_TEST_COMPILATION_CACHE from the job env above.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-xcode26-${{ github.sha }}
          restore-keys: |
            cas-${{ runner.os }}-xcode26-

      - name: Run tests
        run: ./scripts/test.sh

      - name: Save compilation cache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-xcode26-${{ github.sha }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: warn
